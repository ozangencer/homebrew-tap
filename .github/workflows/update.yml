name: Follow pikap releases

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the formula at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./update.sh
      - name: Commit if it changed
        run: |
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "pikap $(grep -m1 'version "' Formula/pikap.rb | cut -d'"' -f2)"
          git push
